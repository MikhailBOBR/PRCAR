services:
  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/prcar?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-a-strong-random-secret-at-least-32-characters}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-local}
      UPLOAD_DIR: ${UPLOAD_DIR:-./public/uploads}
      S3_ENDPOINT: ${DOCKER_S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${DOCKER_S3_REGION:-us-east-1}
      S3_BUCKET: ${DOCKER_S3_BUCKET:-prcar}
      S3_ACCESS_KEY: ${DOCKER_S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${DOCKER_S3_SECRET_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: ${DOCKER_S3_FORCE_PATH_STYLE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./public/uploads:/app/public/uploads

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prcar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prcar"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
